name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (com submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept SDK licenses
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          echo "Usando sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          yes | $SDKMANAGER --install "ndk;27.2.12479018" "cmake;3.22.1" || true
          echo "=== NDK directory ==="
          ls -la "$ANDROID_HOME/ndk/" || true
          echo "=== CMake directory ==="
          ls -la "$ANDROID_HOME/cmake/" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weirdo-neural-debug
          path: app/build/outputs/apk/debug/*.apk
